<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main})}">
<head><title>Stock — InvStock</title></head>
<body>
<main>
  <div class="page-header flex justify-between items-center">
    <div>
      <h1 class="page-title">Stock Transactions</h1>
      <p class="page-subtitle">Track all inventory movements</p>
    </div>
    <a th:href="@{/stock/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg"></i> Record Transaction
    </a>
  </div>

  <div th:if="${success}" class="alert alert-success">
    <i class="bi bi-check-circle"></i><span th:text="${success}"></span>
  </div>
  <div th:if="${error}" class="alert alert-danger">
    <i class="bi bi-exclamation-circle"></i><span th:text="${error}"></span>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
        <tr>
          <th>#</th>
          <th>Product</th>
          <th>Type</th>
          <th>Quantity</th>
          <th>Notes</th>
          <th>Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(transactions)}">
          <td colspan="6" class="text-center text-muted" style="padding:30px">
            No transactions yet.
          </td>
        </tr>
        <tr th:each="t : ${transactions}">
          <td class="font-mono text-muted" th:text="${t.id}"></td>
          <td style="font-weight:500" th:text="${t.product.name}"></td>
          <td>
                            <span class="badge"
                                  th:classappend="${t.type.name() == 'STOCK_IN'}    ? 'badge-success' :
                                                  (${t.type.name() == 'STOCK_OUT'}  ? 'badge-danger'  :
                                                                                       'badge-info')"
                                  th:text="${t.type.name().replace('_',' ')}">
                            </span>
          </td>
          <td th:text="${t.quantity}"></td>
          <td class="text-muted"
              th:text="${t.notes != null ? t.notes : '—'}"></td>
          <td class="text-muted"
              th:text="${#temporals.format(t.createdAt, 'dd MMM yyyy')}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
