<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main})}">
<head><title>Saved Reports — InvStock</title></head>
<body>
<main>

    <div class="page-header flex justify-between items-center">
        <div>
            <h1 class="page-title">Saved Reports</h1>
            <p class="page-subtitle">View, edit and manage your saved reports</p>
        </div>
        <a th:href="@{/reports}" class="btn btn-outline">
            <i class="bi bi-arrow-left"></i> Back to Reports
        </a>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success">
        <i class="bi bi-check-circle"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- Edit form (shows when editing) -->
    <div class="card" style="margin-bottom:24px"
         th:if="${report != null}">
        <div class="card-header">
            <span class="card-title">Edit Report</span>
        </div>
        <form th:action="@{/reports/{id}/edit(id=${report.id})}"
              th:object="${report}"
              method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Report Title *</label>
                    <input type="text" th:field="*{title}"
                           class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Report Type *</label>
                    <select th:field="*{reportType}" class="form-control">
                        <option th:each="t : ${reportTypes}"
                                th:value="${t}"
                                th:text="${t.name().replace('_',' ')}">
                        </option>
                    </select>
                </div>
                <div class="form-group full">
                    <label class="form-label">Notes</label>
                    <textarea th:field="*{notes}"
                              class="form-control">
                    </textarea>
                </div>
            </div>
            <div class="flex gap-2" style="margin-top:20px">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Update Report
                </button>
                <a th:href="@{/reports/saved}" class="btn btn-outline">
                    Cancel
                </a>
            </div>
        </form>
    </div>

    <!-- Saved reports table -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">All Saved Reports</span>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Notes</th>
                    <th>Generated By</th>
                    <th>Date Saved</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(savedReports)}">
                    <td colspan="7" class="text-center text-muted"
                        style="padding:40px">
                        <i class="bi bi-archive"
                           style="font-size:28px;display:block;margin-bottom:8px">
                        </i>
                        No saved reports yet. Go to Reports and save one!
                    </td>
                </tr>
                <tr th:each="r : ${savedReports}">
                    <td class="font-mono text-muted"
                        th:text="${r.id}"></td>
                    <td style="font-weight:500"
                        th:text="${r.title}"></td>
                    <td>
                            <span class="badge badge-info"
                                  th:text="${r.reportType.name().replace('_',' ')}">
                            </span>
                    </td>
                    <td class="text-muted"
                        th:text="${r.notes != null ? r.notes : '—'}"></td>
                    <td th:text="${r.generatedBy}"></td>
                    <td class="text-muted"
                        th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy HH:mm')}">
                    </td>
                    <td>
                        <div class="flex gap-2">
                            <!-- Edit -->
                            <a th:href="@{/reports/{id}/edit(id=${r.id})}"
                               class="btn btn-outline btn-sm btn-icon"
                               title="Edit">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- Delete -->
                            <form th:action="@{/reports/{id}/delete(id=${r.id})}"
                                  method="post"
                                  onsubmit="return confirm('Delete this report?')">
                                <button type="submit"
                                        class="btn btn-danger btn-sm btn-icon"
                                        title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
