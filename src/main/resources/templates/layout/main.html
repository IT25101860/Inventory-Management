<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:replace="${title}">InventoryPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --sidebar-bg: #0f1729;
        --sidebar-hover: #1a2540;
        --sidebar-active: #1e2d4a;
        --sidebar-text: #8b9ab5;
        --sidebar-text-active: #ffffff;
        --sidebar-accent: #4f8ef7;
        --main-bg: #f0f2f7;
        --card-bg: #ffffff;
        --text-primary: #1a1f36;
        --text-secondary: #6b7280;
        --text-muted: #9ca3af;
        --border: #e5e7eb;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --info: #3b82f6;
        --sidebar-width: 240px;
    }

    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--main-bg);
        color: var(--text-primary);
        display: flex;
        min-height: 100vh;
        font-size: 14px;
    }

    /* ── SIDEBAR ─────────────────────────────── */
    .sidebar {
        width: var(--sidebar-width);
        background: var(--sidebar-bg);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0; left: 0; bottom: 0;
        z-index: 100;
        overflow-y: auto;
    }

    .sidebar-brand {
        padding: 20px 20px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .brand-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
    }

    .brand-icon {
        width: 34px; height: 34px;
        background: var(--sidebar-accent);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        color: white;
        font-size: 16px;
        flex-shrink: 0;
    }

    .brand-name {
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: -0.2px;
    }

    .brand-sub {
        font-size: 10px;
        color: var(--sidebar-text);
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }

    .sidebar-nav {
        flex: 1;
        padding: 12px 10px;
    }

    .nav-section-label {
        font-size: 10px;
        font-weight: 600;
        color: var(--sidebar-text);
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 14px 10px 6px;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 8px;
        color: var(--sidebar-text);
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 400;
        transition: all 0.15s;
        margin-bottom: 2px;
    }

    .nav-item:hover {
        background: var(--sidebar-hover);
        color: #c8d3e8;
    }

    .nav-item.active {
        background: var(--sidebar-active);
        color: var(--sidebar-text-active);
        font-weight: 500;
    }

    .nav-item.active .nav-icon {
        color: var(--sidebar-accent);
    }

    .nav-icon {
        font-size: 16px;
        width: 18px;
        text-align: center;
        flex-shrink: 0;
    }

    .sidebar-footer {
        padding: 14px 16px;
        border-top: 1px solid rgba(255,255,255,0.06);
    }

    .user-pill {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .user-avatar {
        width: 32px; height: 32px;
        background: var(--sidebar-accent);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px;
        font-weight: 600;
        color: white;
        flex-shrink: 0;
    }

    .user-name { font-size: 13px; color: #c8d3e8; font-weight: 500; }
    .user-role { font-size: 11px; color: var(--sidebar-text); }

    .signout-link {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--sidebar-text);
        text-decoration: none;
        font-size: 12px;
        margin-top: 12px;
        padding: 6px 4px;
        border-radius: 6px;
        transition: all 0.15s;
    }
    .signout-link:hover { color: #ffffff; }

    /* ── MAIN CONTENT ────────────────────────── */
    .main-wrapper {
        margin-left: var(--sidebar-width);
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    .topbar {
        background: var(--card-bg);
        border-bottom: 1px solid var(--border);
        padding: 0 28px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .topbar-search {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--main-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 14px;
        width: 280px;
        color: var(--text-muted);
        font-size: 13px;
        font-family: 'DM Sans', sans-serif;
    }

    .topbar-right {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .topbar-btn {
        width: 34px; height: 34px;
        background: var(--main-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 15px;
        text-decoration: none;
    }

    .topbar-btn:hover { background: var(--border); color: var(--text-primary); }

    .page-content {
        flex: 1;
        padding: 28px;
    }

    /* ── PAGE HEADER ─────────────────────────── */
    .page-header {
        margin-bottom: 24px;
    }

    .page-title {
        font-size: 22px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.4px;
    }

    .page-subtitle {
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 3px;
    }

    /* ── CARDS ───────────────────────────────── */
    .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px 24px;
    }

    .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
    }

    .card-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
    }

    /* ── STAT CARDS ──────────────────────────── */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
    }

    .stat-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .stat-icon {
        width: 44px; height: 44px;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
    }

    .stat-icon.blue   { background: #eff6ff; color: #3b82f6; }
    .stat-icon.green  { background: #f0fdf4; color: #10b981; }
    .stat-icon.amber  { background: #fffbeb; color: #f59e0b; }
    .stat-icon.red    { background: #fef2f2; color: #ef4444; }
    .stat-icon.purple { background: #f5f3ff; color: #8b5cf6; }
    .stat-icon.teal   { background: #f0fdfa; color: #14b8a6; }

    .stat-value {
        font-size: 22px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.5px;
        line-height: 1;
    }

    .stat-label {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
    }

    /* ── TABLES ──────────────────────────────── */
    .table-wrap {
        overflow-x: auto;
    }

    table.data-table {
        width: 100%;
        border-collapse: collapse;
    }

    .data-table th {
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-muted);
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
    }

    .data-table td {
        padding: 12px 14px;
        border-bottom: 1px solid #f3f4f6;
        font-size: 13.5px;
        color: var(--text-primary);
        vertical-align: middle;
    }

    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #fafbff; }

    /* ── BADGES ──────────────────────────────── */
    .badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.2px;
    }

    .badge-success { background: #dcfce7; color: #16a34a; }
    .badge-warning { background: #fef9c3; color: #a16207; }
    .badge-danger  { background: #fee2e2; color: #dc2626; }
    .badge-info    { background: #dbeafe; color: #1d4ed8; }
    .badge-gray    { background: #f3f4f6; color: #6b7280; }
    .badge-purple  { background: #ede9fe; color: #7c3aed; }

    /* ── BUTTONS ─────────────────────────────── */
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        text-decoration: none;
        font-family: 'DM Sans', sans-serif;
        transition: all 0.15s;
        white-space: nowrap;
    }

    .btn-primary { background: #0f1729; color: white; }
    .btn-primary:hover { background: #1a2540; }

    .btn-outline {
        background: white;
        color: var(--text-primary);
        border: 1px solid var(--border);
    }
    .btn-outline:hover { background: var(--main-bg); }

    .btn-danger {
        background: #fef2f2;
        color: #dc2626;
        border: 1px solid #fecaca;
    }
    .btn-danger:hover { background: #fee2e2; }

    .btn-success { background: #0f1729; color: white; }
    .btn-success:hover { background: #1a2540; }

    .btn-sm { padding: 5px 11px; font-size: 12px; }
    .btn-icon { padding: 6px 8px; }

    /* ── FORMS ───────────────────────────────── */
    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    .form-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .form-control {
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13.5px;
        font-family: 'DM Sans', sans-serif;
        color: var(--text-primary);
        background: white;
        outline: none;
        transition: border-color 0.15s;
    }

    .form-control:focus { border-color: var(--sidebar-accent); }
    .form-control.is-invalid { border-color: var(--danger); }

    .error-msg { font-size: 11.5px; color: var(--danger); }

    select.form-control { cursor: pointer; }
    textarea.form-control { resize: vertical; min-height: 90px; }

    /* ── ALERTS ──────────────────────────────── */
    .alert {
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .alert-danger  { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-warning { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

    /* ── UTILS ───────────────────────────────── */
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .mb-4 { margin-bottom: 20px; }
    .mb-6 { margin-bottom: 24px; }
    .text-muted { color: var(--text-muted); font-size: 13px; }
    .text-center { text-align: center; }
    .font-mono { font-family: 'DM Mono', monospace; font-size: 12px; }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     SIDEBAR
══════════════════════════════════════════ -->
<aside class="sidebar">

  <div class="sidebar-brand">
    <a href="/" class="brand-logo">
      <div class="brand-icon"><i class="bi bi-boxes"></i></div>
      <div>
        <div class="brand-name">InvStock</div>
        <div class="brand-sub">Inventory Pro</div>
      </div>
    </a>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a th:href="@{/dashboard}" class="nav-item"
       th:classappend="${activePage == 'dashboard'} ? ' active'">
      <i class="bi bi-grid-1x2 nav-icon"></i> Dashboard
    </a>

    <div class="nav-section-label">Management</div>
    <a th:href="@{/products}" class="nav-item"
       th:classappend="${activePage == 'products'} ? ' active'">
      <i class="bi bi-box-seam nav-icon"></i> Products
    </a>
    <a th:href="@{/stock}" class="nav-item"
       th:classappend="${activePage == 'stock'} ? ' active'">
      <i class="bi bi-arrow-left-right nav-icon"></i> Stock
    </a>
    <a th:href="@{/suppliers}" class="nav-item"
       th:classappend="${activePage == 'suppliers'} ? ' active'">
      <i class="bi bi-truck nav-icon"></i> Suppliers
    </a>
    <a th:href="@{/orders}" class="nav-item"
       th:classappend="${activePage == 'orders'} ? ' active'">
      <i class="bi bi-bag-check nav-icon"></i> Orders
    </a>

    <!-- ── Reports: Admin and Manager only ── -->
    <div th:if="${sessionRole == 'ADMIN' or sessionRole == 'MANAGER'}">
      <a th:href="@{/reports}" class="nav-item"
         th:classappend="${activePage == 'reports'} ? ' active'">
        <i class="bi bi-bar-chart-line nav-icon"></i> Reports
      </a>
    </div>

    <!-- ── System: Admin only ── -->
    <div th:if="${sessionRole == 'ADMIN'}">
      <div class="nav-section-label">System</div>
      <a th:href="@{/users}" class="nav-item"
         th:classappend="${activePage == 'users'} ? ' active'">
        <i class="bi bi-people nav-icon"></i> Users
      </a>
    </div>
  </nav>

  <!-- ── SIDEBAR FOOTER ── -->
  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="user-avatar"
           th:text="${sessionUser != null ? sessionUser.username.substring(0,1).toUpperCase() : 'A'}">
        A
      </div>
      <div>
        <div class="user-name"
             th:text="${sessionUser != null ? sessionUser.username : 'Admin'}">
          Admin
        </div>
        <div class="user-role"
             th:text="${sessionUser != null ? sessionUser.role : 'ADMIN'}">
          ADMIN
        </div>
      </div>
    </div>
    <a th:href="@{/logout}" class="signout-link">
      <i class="bi bi-box-arrow-left"></i> Sign Out
    </a>
  </div>

</aside>

<!-- ══════════════════════════════════════════
     MAIN CONTENT
══════════════════════════════════════════ -->
<div class="main-wrapper">

  <header class="topbar">
    <div></div>
    <div class="topbar-right">
      <a th:href="@{/dashboard}" class="topbar-btn">
        <i class="bi bi-bell"></i>
      </a>
      <a th:href="@{/users}" class="topbar-btn">
        <i class="bi bi-person-circle"></i>
      </a>
    </div>
  </header>

  <main class="page-content" th:replace="${content}">
    <!-- Page content injected here -->
  </main>

</div>

</body>
</html>
