<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main})}">
<head><title>Suppliers — InvStock</title></head>
<body>
<main>
  <div class="page-header flex justify-between items-center">
    <div>
      <h1 class="page-title">Suppliers</h1>
      <p class="page-subtitle">Manage your supplier relationships</p>
    </div>
    <a th:if="${sessionRole == 'ADMIN' or sessionRole == 'MANAGER'}"
       th:href="@{/suppliers/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg"></i> Add Supplier
    </a>
  </div>

  <div th:if="${success}" class="alert alert-success">
    <i class="bi bi-check-circle"></i><span th:text="${success}"></span>
  </div>
  <div th:if="${error}" class="alert alert-danger">
    <i class="bi bi-exclamation-circle"></i><span th:text="${error}"></span>
  </div>

  <div class="card mb-4">
    <form th:action="@{/suppliers}" method="get" class="flex gap-2 items-center">
      <input type="text" name="search" class="form-control"
             placeholder="Search suppliers..." th:value="${search}"
             style="max-width:300px">
      <button type="submit" class="btn btn-outline">
        <i class="bi bi-search"></i> Search
      </button>
      <a th:href="@{/suppliers}" class="btn btn-outline">Clear</a>
    </form>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
        <tr>
          <th>Company</th>
          <th>Contact Person</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(suppliers)}">
          <td colspan="6" class="text-center text-muted" style="padding:30px">
            No suppliers found.
          </td>
        </tr>
        <tr th:each="s : ${suppliers}">
          <td style="font-weight:500" th:text="${s.companyName}"></td>
          <td th:text="${s.contactPerson}"></td>
          <td th:text="${s.email}"></td>
          <td th:text="${s.phone != null ? s.phone : '—'}"></td>
          <td>
            <span th:if="${s.active}" class="badge badge-success">Active</span>
            <span th:unless="${s.active}" class="badge badge-gray">Inactive</span>
          </td>
          <td>
            <div class="flex gap-2">
              <a th:if="${sessionRole == 'ADMIN' or sessionRole == 'MANAGER'}"
                 th:href="@{/suppliers/{id}/edit(id=${s.id})}"
                 class="btn btn-outline btn-sm btn-icon">
                <i class="bi bi-pencil"></i>
              </a>
              <form th:if="${sessionRole == 'ADMIN'}"
                    th:action="@{/suppliers/{id}/delete(id=${s.id})}"
                    method="post"
                    onsubmit="return confirm('Remove this supplier?')">
                <button class="btn btn-danger btn-sm btn-icon">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
