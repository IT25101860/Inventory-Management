<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main})}">
<head><title>Supplier Form — InvStock</title></head>
<body>
<main>
  <div class="page-header flex items-center gap-3">
    <a th:href="@{/suppliers}" class="btn btn-outline btn-icon">
      <i class="bi bi-arrow-left"></i>
    </a>
    <div>
      <h1 class="page-title" th:text="${isEdit} ? 'Edit Supplier' : 'Add Supplier'"></h1>
      <p class="page-subtitle">Fill in the supplier details</p>
    </div>
  </div>

  <div class="card" style="max-width:680px">
    <form th:action="${isEdit} ? @{/suppliers/{id}/edit(id=${supplier.id})} : @{/suppliers/new}"
          th:object="${supplier}" method="post">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Company Name *</label>
          <input type="text" th:field="*{companyName}" class="form-control"
                 th:classappend="${#fields.hasErrors('companyName')} ? ' is-invalid'">
          <span class="error-msg" th:errors="*{companyName}"
                th:if="${#fields.hasErrors('companyName')}"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Contact Person *</label>
          <input type="text" th:field="*{contactPerson}" class="form-control"
                 th:classappend="${#fields.hasErrors('contactPerson')} ? ' is-invalid'">
          <span class="error-msg" th:errors="*{contactPerson}"
                th:if="${#fields.hasErrors('contactPerson')}"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input type="email" th:field="*{email}" class="form-control"
                 th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
          <span class="error-msg" th:errors="*{email}"
                th:if="${#fields.hasErrors('email')}"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" th:field="*{phone}" class="form-control">
        </div>
        <div class="form-group full">
          <label class="form-label">Address</label>
          <textarea th:field="*{address}" class="form-control"></textarea>
        </div>
        <div class="form-group" th:if="${isEdit}">
          <label class="form-label">Status</label>
          <select th:field="*{active}" class="form-control">
            <option value="true">Active</option>
            <option value="false">Inactive</option>
          </select>
        </div>
      </div>
      <div class="flex gap-2" style="margin-top:24px">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg"></i>
          <span th:text="${isEdit} ? 'Update Supplier' : 'Add Supplier'"></span>
        </button>
        <a th:href="@{/suppliers}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
